# TODO: Verify additional engineer data manually, this is mostly sourced from game journals or EDDI
target_table: engineers
upsert_sql: |
  INSERT INTO engineers (
      system_id64,
      body_id64,
      market_id,
      engineer_id,
      name,
      engineer_type,
      specialties,
      permit_required,
      referral_from,
      unlock_requirement,
      max_grade,
      region,
      update_dtm
  ) VALUES (
      %(system_id64)s,
      %(body_id64)s,
      %(market_id)s,
      %(engineer_id)s,
      %(name)s,
      %(engineer_type)s,
      %(specialties)s,
      %(permit_required)s,
      %(referral_from)s,
      %(unlock_requirement)s,
      %(max_grade)s,
      %(region)s,
      (now() AT TIME ZONE 'utc')
  )
  ON CONFLICT (engineer_id) DO UPDATE SET
      system_id64 = EXCLUDED.system_id64,
      body_id64 = EXCLUDED.body_id64,
      market_id = EXCLUDED.market_id,
      name = EXCLUDED.name,
      engineer_type = EXCLUDED.engineer_type,
      specialties = EXCLUDED.specialties,
      permit_required = EXCLUDED.permit_required,
      referral_from = EXCLUDED.referral_from,
      unlock_requirement = EXCLUDED.unlock_requirement,
      max_grade = EXCLUDED.max_grade,
      region = EXCLUDED.region,
      update_dtm = (now() AT TIME ZONE 'utc');
